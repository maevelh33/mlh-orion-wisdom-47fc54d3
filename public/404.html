<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex">
    <title>Page introuvable | MLH.ORION</title>
    <script>
      // Netlify sert ce fichier pour les adresses inconnues : on renvoie vers l'application,
      // qui affiche sa propre page « introuvable ».
      var l = window.location;
      l.replace('/?redirect=' + encodeURIComponent(l.pathname + l.search + l.hash));
    </script>
  </head>
  <body></body>
</html>
