# Configuration Netlify (hébergeur de mlhorion.com).
# Netlify lit ce fichier à chaque push sur main : il construit le site et publie dist/.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Node 22 pour construire le site (Node 20 n'est plus maintenu).
  NODE_VERSION = "22"

# Fonctions serveur de la boutique (paiement Stripe, webhook, administration),
# servies sous /api/… (voir l'adresse « path » en bas de chaque fichier).
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Pages de l'espace client : l'application s'en charge directement
# (sans passer par 404.html, pour que les liens de connexion arrivent intacts).
[[redirects]]
  from = "/compte/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/compte"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/connexion"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

# Les adresses inconnues reçoivent dist/404.html (automatique sur Netlify),
# qui renvoie vers l'application et sa page « Page introuvable ».

# Fichiers avec une empreinte dans leur nom (dist/assets) : jamais modifiés, cache long.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
